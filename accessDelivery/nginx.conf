location = /mediaforge/access { return 308 /mediaforge/access/; }
location ^~ /mediaforge/access/files/ {
    auth_request /mediaforge/_accessAuth;
    alias /opt/mediaforge/access/current/files/;
    autoindex off;
    default_type application/zip;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
location = /mediaforge/_accessAuth {
    internal;
    proxy_pass http://unix:/run/mediaforge/api.sock:/api/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
}
location ^~ /mediaforge/access/ {
    alias /opt/mediaforge/access/current/site/;
    index index.html;
    autoindex off;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    limit_except GET { deny all; }
}
