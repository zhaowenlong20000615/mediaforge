<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediaForge · 工作台</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="brand"><span class="mark">MF</span><div><strong>MediaForge</strong><small>媒体与文档工作台</small></div></div><nav><a class="active" href="#workbench">工作台</a><a href="#history">历史</a><a href="#diagnostics">诊断</a></nav><div class="health"><i></i>本地服务正常</div></header><main><section class="hero"><div><p class="eyebrow">LOCAL-FIRST / 0.1.0</p><h1>把杂乱素材，<em>变成可交付结果。</em></h1><p class="lede">视频、音频、字幕、PDF、Word 和图片在一个可恢复的队列里处理。文件留在你的工作区，结果可核验。</p></div><div class="pulse"><span>队列</span><b id="queueCount">0</b><small>个任务</small></div></section><section id="workbench" class="workspace"><div class="panel tools"><div class="panel-head"><div><span class="kicker">01 / 选择工具</span><h2>你要处理什么？</h2></div><button id="refresh" class="icon-btn" aria-label="刷新">↻</button></div><div id="toolList" class="tool-list"></div></div><div class="panel submit"><div class="panel-head"><div><span class="kicker">02 / 加入文件</span><h2>配置一次，批量执行</h2></div></div><label class="drop" id="drop"><input id="files" type="file" multiple><span class="drop-icon">＋</span><strong>拖入文件，或点击选择</strong><small>文件只在本机处理 · 支持 Unicode 文件名</small></label><div id="selected" class="selected"></div><div id="params" class="params"></div><button id="submit" class="primary" disabled>创建处理任务 <span>→</span></button></div></section><section id="history" class="panel queue"><div class="panel-head"><div><span class="kicker">03 / 任务队列</span><h2>最近处理</h2></div><select id="filter"><option value="">全部状态</option><option>running</option><option>succeeded</option><option>failed</option><option>recoverable</option></select></div><div id="tasks" class="tasks empty">还没有任务。选择工具并加入文件，队列会在这里显示。</div></section><section id="diagnostics" class="diag"><div><span class="kicker">依赖状态</span><h2>工具链自检</h2><p>缺失的适配器会明确标记，不会把“请求受理”误报成结果成功。</p></div><div id="checks" class="checks"></div></section></main><footer>MediaForge · 本地优先 · 结果质量需人工确认</footer><script src="/static/app.js"></script></body></html>
